packages:
  - apps/*
allowBuilds:
  "@ffmpeg-installer/darwin-arm64": true
  "@ffmpeg-installer/linux-x64": true
  "@google/genai": false
  # testcontainers→ssh2 の docker-over-ssh 用ネイティブ拡張。不使用なのでビルドしない
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@tanstack/charts@0.5.1"
  - "@tanstack/react-charts@0.5.1"
# vite-plus (0.2.x) bundles its own vitest/vite; pnpm's isolated layout splits
# @vitest/browser onto a second vite instance and breaks browser mode.
# Hoisted layout restores npm-compatible resolution until upstream supports it.
nodeLinker: hoisted
