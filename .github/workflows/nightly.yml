name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full suite including @backend (full-stack) tests.
  # When a real LLM provider is wired in, set LLM_PROVIDER + API key here —
  # this job becomes the real-LLM smoke lane without touching any test code.
  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run full E2E (quarantine excluded from gate)
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep-invert "@quarantine"
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: e2e/playwright-report/
          retention-days: 14

  # Real-LLM smoke lane: run only the @backend tests against real Gemini.
  # LLM_SMOKE=1 flips the api webServer to LLM_PROVIDER=gemini (playwright
  # config); the key comes from Secrets. No retries — a real flaky call should
  # be visible, not masked. Test code is unchanged: the @backend structural
  # assertions are provider-agnostic by design.
  llm-smoke:
    runs-on: ubuntu-latest
    # The @backend chat tests still boot the full api (e2e-api.mjs), which needs
    # a DB even though these cases do not touch tickets. Same postgres service
    # as the other lanes (spec: specs/database.md).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real-LLM smoke (@backend only)
        env:
          LLM_SMOKE: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep "@backend" --retries=0
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-report
          path: e2e/playwright-report/
          retention-days: 14

  # Evals lane: reply-draft LLM quality regression (spec: specs/evals.md).
  # No DB, no Playwright — the harness assembles the production prompts as pure
  # functions and calls Gemini directly (generation + LLM-as-judge).
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run reply-draft evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm evals
      - name: Upload evals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: apps/api/evals-report.json
          retention-days: 14

  # Perf lane: record traces for every test; the trace-analyst skill consumes
  # the artifact locally (gh run download --name perf-traces).
  perf:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E with full tracing
        env:
          PW_TRACE: "on"
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep-invert "@quarantine"
      - name: Upload traces for local analysis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: e2e/test-results/
          retention-days: 14
