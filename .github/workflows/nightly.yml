name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write # triage が失敗を issue に起票・追記する

jobs:
  # Full suite including @backend (full-stack) tests.
  # When a real LLM provider is wired in, set LLM_PROVIDER + API key here —
  # this job becomes the real-LLM smoke lane without touching any test code.
  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run full E2E (quarantine excluded from gate)
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep-invert "@quarantine"
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: e2e/playwright-report/
          retention-days: 14

  # Real-LLM smoke lane: run only the @backend tests against real Gemini.
  # LLM_SMOKE=1 flips the api webServer to LLM_PROVIDER=gemini (playwright
  # config); the key comes from Secrets. No retries — a real flaky call should
  # be visible, not masked. Test code is unchanged: the @backend structural
  # assertions are provider-agnostic by design.
  llm-smoke:
    runs-on: ubuntu-latest
    # The @backend chat tests still boot the full api (e2e-api.mjs), which needs
    # a DB even though these cases do not touch tickets. Same postgres service
    # as the other lanes (spec: specs/database.md).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real-LLM smoke (@backend only)
        env:
          LLM_SMOKE: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep "@backend" --retries=0
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-report
          path: e2e/playwright-report/
          retention-days: 14

  # Evals lane: reply-draft LLM quality regression (spec: specs/evals.md).
  # No DB, no Playwright — the harness assembles the production prompts as pure
  # functions and calls Gemini directly (generation + LLM-as-judge).
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run reply-draft evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm evals
      - name: Upload evals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: apps/api/evals-report.json
          retention-days: 14

  # Perf lane: record traces for every test; the trace-analyst skill consumes
  # the artifact locally (gh run download --name perf-traces).
  perf:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E with full tracing
        env:
          PW_TRACE: "on"
        run: pnpm exec playwright test -c e2e/playwright.config.ts --grep-invert "@quarantine"
      - name: Upload traces for local analysis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: e2e/test-results/
          retention-days: 14

  # Triage lane: nightly は無人実行なので、失敗をローリング issue に起票して
  # 翌セッションのループへ戻す(5夜連続赤が誰にも見えていなかった件の対策)。
  # open な nightly-failure issue が既にあればコメントで追記し、無ければ新規
  # 起票する — 1 連続失敗ストリーク = 1 issue に集約され、修正でクローズする。
  triage:
    runs-on: ubuntu-latest
    needs: [full, llm-smoke, evals, perf]
    if: ${{ failure() }}
    steps:
      - name: File or append the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_FULL: ${{ needs.full.result }}
          RESULT_LLM_SMOKE: ${{ needs.llm-smoke.result }}
          RESULT_EVALS: ${{ needs.evals.result }}
          RESULT_PERF: ${{ needs.perf.result }}
        run: |
          body=$(printf '%s\n' \
            "## Nightly failure — $(date -u +%Y-%m-%d) ([run]($RUN_URL))" \
            "" \
            "| job | result |" \
            "| --- | --- |" \
            "| full | $RESULT_FULL |" \
            "| llm-smoke | $RESULT_LLM_SMOKE |" \
            "| evals | $RESULT_EVALS |" \
            "| perf | $RESULT_PERF |" \
            "" \
            "レポート artifact は run ページから (nightly-report / llm-smoke-report / evals-report / perf-traces)。")
          gh label create nightly-failure -R "$REPO" \
            --color B60205 --description "nightly レーンの失敗トリアージ" --force
          existing=$(gh issue list -R "$REPO" --label nightly-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "Nightly が失敗しています" \
              --label nightly-failure --body "$body"
          fi
