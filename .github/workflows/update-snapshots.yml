# VRT baseline の再生成(意図した UI 変更時)。対象ブランチへ dispatch すると
# linux で visual.spec.ts を --update-snapshots 実行し、差分があれば baseline
# 画像をそのブランチにコミットする。PR の Files タブが新旧画像ビューアになる。
# 使い方: gh workflow run update-snapshots.yml --ref <branch>
name: update-snapshots

on:
  workflow_dispatch:
  # bootstrap 用の一時トリガー(初回 baseline 生成後に削除する):
  # workflow_dispatch はワークフローがデフォルトブランチに存在しないと呼べない
  # ため、導入ブランチ自身の push で初回生成を行う。
  push:
    branches: [feat/visual-regression]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate visual baselines
        run: pnpm exec playwright test -c e2e/playwright.config.ts visual.spec.ts --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A e2e/tests/*-snapshots
          if git diff --cached --quiet; then
            echo "no baseline changes"
          else
            git commit -m "vrt: update visual baselines"
            git push
          fi
